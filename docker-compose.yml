services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: voxacare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: voxacare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxacare -d voxacare"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://voxacare:${POSTGRES_PASSWORD}@db:5432/voxacare
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: